<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="179" height="92" viewBox="0 0 179 92" role="img" aria-label="Email"><title>Email</title><style>@font-face{font-family:B;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite}
